<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Ker(PoliTo) Recruitment</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --verde: #0D352D;
    --blu: #253A70;
    --giallo: #E8D600;
    --sfondo: #EFF2F0;
    --card: #F4F6F4;
    --bordo: #DDE4E0;
    --testo: #48554F;
    --testo-2: #56635D;
    --scuro: #18251F;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--sfondo);
    color: var(--scuro);
    font-family: Arial, Helvetica, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { padding: 32px 14px 140px; }

  .card {
    max-width: 620px;
    margin: 0 auto;
    background: #FFFFFF;
    border-radius: 18px;
    overflow: hidden;
  }

  .header {
    background: var(--verde);
    padding: 30px 40px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .header img { display: block; width: 160px; max-width: 55%; height: auto; }

  .tag {
    font-size: 10px;
    line-height: 1.5;
    font-weight: bold;
    letter-spacing: 1.3px;
    color: #D5E0DB;
    text-align: right;
  }

  .linea { height: 6px; background: var(--giallo); }

  .corpo { padding: 40px 42px 38px; }

  .saluto {
    margin: 0 0 10px;
    font-size: 22px;
    line-height: 1.3;
    font-weight: bold;
    color: var(--blu);
  }

  h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 38px;
    line-height: 1.08;
    font-weight: normal;
    color: var(--verde);
  }

  .intro {
    margin: 22px 0 0;
    font-size: 16px;
    line-height: 1.72;
    color: var(--testo);
  }

  .intro strong, .nota strong { color: var(--scuro); }

  .giorno { margin-top: 30px; }

  .giorno h2 {
    margin: 0 0 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid #E2E7E4;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px;
    font-weight: normal;
    color: var(--verde);
  }

  .orari {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
    gap: 8px;
  }

  .orario {
    appearance: none;
    -webkit-appearance: none;
    margin: 0;
    padding: 13px 0;
    border: 1px solid var(--bordo);
    border-radius: 8px;
    background: var(--card);
    color: var(--verde);
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: border-color .12s, background-color .12s, color .12s;
  }

  .orario:hover { border-color: var(--blu); }

  .orario:focus-visible { outline: 3px solid var(--giallo); outline-offset: 2px; }

  .orario[aria-pressed="true"] {
    background: var(--blu);
    border-color: var(--blu);
    color: #FFFFFF;
  }

  .orario:disabled { cursor: wait; opacity: .6; }

  .box {
    margin-top: 28px;
    padding: 24px 22px;
    background: var(--card);
    border: 1px solid #E1E7E3;
    border-radius: 12px;
  }

  .box .etichetta {
    margin: 0 0 12px;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1.5px;
    color: var(--blu);
  }

  .box .giorno-ok {
    margin: 0;
    font-size: 16px;
    line-height: 1.5;
    font-weight: bold;
    color: var(--scuro);
  }

  .box .ora-ok {
    margin: 4px 0 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 32px;
    line-height: 1.1;
    color: var(--verde);
  }

  .nota {
    margin: 22px 0 0;
    font-size: 15px;
    line-height: 1.72;
    color: var(--testo-2);
  }

  .avviso {
    margin-top: 24px;
    padding: 14px 16px;
    border-radius: 10px;
    background: #FBF6D2;
    border: 1px solid #E9DC7A;
    font-size: 14px;
    line-height: 1.55;
    color: #4A4317;
  }

  .avviso.errore {
    background: #FBEDEA;
    border-color: #EBC2B9;
    color: #6B2A1E;
  }

  .link {
    padding: 0;
    border: 0;
    background: none;
    color: var(--blu);
    font: inherit;
    font-weight: bold;
    text-decoration: underline;
    cursor: pointer;
  }

  a { color: var(--blu); font-weight: bold; }

  .footer {
    background: var(--verde);
    padding: 22px 42px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    font-size: 11px;
    line-height: 1.55;
    color: #CAD5D0;
  }

  .footer strong { color: #FFFFFF; }

  .footer .tag { font-size: 9px; letter-spacing: 1.2px; color: #91A49C; }

  .barra {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: #FFFFFF;
    border-top: 1px solid var(--bordo);
    box-shadow: 0 -8px 24px rgba(13, 53, 45, .10);
    transform: translateY(110%);
    visibility: hidden;
    transition: transform .2s ease, visibility 0s linear .2s;
  }

  .barra.visibile {
    transform: none;
    visibility: visible;
    transition: transform .2s ease, visibility 0s;
  }

  .barra-interna {
    max-width: 620px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .scelta { font-size: 13px; line-height: 1.4; color: var(--testo-2); }

  .scelta strong { display: block; font-size: 16px; color: var(--scuro); }

  .bottone {
    padding: 16px 22px;
    border: 0;
    border-radius: 8px;
    background: var(--blu);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: .7px;
    white-space: nowrap;
    cursor: pointer;
  }

  .bottone:disabled { opacity: .65; cursor: wait; }

  .bottone:focus-visible { outline: 3px solid var(--giallo); outline-offset: 2px; }

  @media (max-width: 520px) {
    .wrap { padding: 16px 10px 170px; }
    .header { padding: 24px 22px 22px; }
    .header img { width: 130px; }
    .corpo { padding: 30px 22px 28px; }
    .saluto { font-size: 20px; }
    h1 { font-size: 31px; }
    .intro { font-size: 15px; }
    .footer { padding: 18px 22px; }
    .barra-interna { flex-direction: column; align-items: stretch; gap: 10px; }
    .bottone { width: 100%; }
  }
</style>
</head>

  const API_URL = "https://script.google.com/macros/s/AKfycbwyCVLrBDTv_wYGneXajnYUW09RS5F7TQSFXueIKmGbLz4C1kEhrtNlEchNRKIzUBG__w/exec";
  const CONTATTO = "teamkerpolito@gmail.com";
  const TOKEN = new URLSearchParams(window.location.search).get("t") || "";

  let DATI = { stato: "caricamento", lingua: linguaBrowser(), replyTo: CONTATTO };

  function linguaBrowser() {
    return /^it/i.test(navigator.language || "") ? "it" : "en";
  }

  const TESTI = {
    it: {
      tag: "RECRUITMENT<br>AUTUNNO 2026",
      saluto: "Ciao {nome},",
      titoloScegli: "Prenota il tuo<br>colloquio.",
      introScegli: "Prenota <strong>un solo slot</strong> tra quelli ancora liberi. Se più avanti ti serve cambiarlo, potrai farlo da questa stessa pagina.",
      introModifica: "Al momento hai prenotato <strong>{slot}</strong>. Scegli un altro slot per cambiarlo.",
      tieni: "Tieni lo slot attuale",
      haiScelto: "Hai scelto",
      conferma: "CONFERMA LO SLOT",
      inCorso: "PRENOTAZIONE IN CORSO...",
      titoloOk: "Slot<br>prenotato!",
      etichettaOk: "IL TUO COLLOQUIO",
      notaOk: "Riceverai un'email di conferma con tutti i dettagli, compreso il luogo del colloquio.",
      cambia: "Cambia slot",
      nonModificabile: "Il colloquio è vicino: per cambiare orario rispondi all'email che ti abbiamo mandato.",
      nessunoSlot: "Al momento non ci sono slot liberi. Rispondi all'email che ti abbiamo mandato e troveremo una soluzione insieme.",
      nessunoVa: "Nessuno slot va bene per te? Rispondi all'email che ti abbiamo mandato.",
      titoloChiuso: "Prenotazioni<br>chiuse.",
      testoChiuso: "Non è più possibile prenotare o cambiare slot da questa pagina. Per qualsiasi cosa rispondi all'email che ti abbiamo mandato.",
      demo: "Anteprima di prova: la prenotazione non viene salvata.",
      errori: {
        occupato: "Questo slot è appena stato prenotato da qualcun altro. Scegline un altro.",
        troppo_tardi: "Questo slot non è più prenotabile. Scegline un altro.",
        non_trovato: "Questo slot non è più disponibile. Scegline un altro.",
        non_modificabile: "Il tuo colloquio è troppo vicino per cambiarlo da qui: rispondi all'email che ti abbiamo mandato.",
        riprova: "Ci sono molte richieste in questo momento: riprova tra qualche secondo.",
        generico: "Qualcosa è andato storto. Riprova tra poco oppure rispondi all'email che ti abbiamo mandato."
      }
    },
    en: {
      tag: "RECRUITMENT<br>AUTUMN 2026",
      saluto: "Hi {nome},",
      titoloScegli: "Book your<br>interview.",
      introScegli: "Book <strong>one slot only</strong> among those still available. If you need to change it later, you can do it from this same page.",
      introModifica: "You're currently booked for <strong>{slot}</strong>. Pick another slot to change it.",
      tieni: "Keep my current slot",
      haiScelto: "Your choice",
      conferma: "CONFIRM THIS SLOT",
      inCorso: "BOOKING...",
      titoloOk: "You're<br>booked!",
      etichettaOk: "YOUR INTERVIEW",
      notaOk: "You'll receive a confirmation email with all the details, including the place of the interview.",
      cambia: "Change slot",
      nonModificabile: "Your interview is coming up soon: to change the time, reply to the email we sent you.",
      nessunoSlot: "There are no free slots at the moment. Reply to the email we sent you and we'll find a solution together.",
      nessunoVa: "None of the slots work for you? Reply to the email we sent you.",
      titoloChiuso: "Booking<br>is closed.",
      testoChiuso: "You can no longer book or change slots from this page. For anything else, reply to the email we sent you.",
      demo: "Test preview: bookings are not saved.",
      errori: {
        occupato: "Someone else has just booked this slot. Please pick another one.",
        troppo_tardi: "This slot can no longer be booked. Please pick another one.",
        non_trovato: "This slot is no longer available. Please pick another one.",
        non_modificabile: "Your interview is too close to change it from here: reply to the email we sent you.",
        riprova: "We're getting a lot of requests right now: please try again in a few seconds.",
        generico: "Something went wrong. Please try again shortly or reply to the email we sent you."
      }
    }
  };

  let L = TESTI[DATI.lingua] || TESTI.it;

  const stato = {
    prenotazione: null,
    slots: [],
    scelto: null,
    modifica: false,
    inviando: false,
    messaggio: null,       // { testo, errore }
    chiuso: false
  };

  const app = document.getElementById("app");
  const barra = document.getElementById("barra");
  const scelta = document.getElementById("scelta");
  const bottone = document.getElementById("conferma");

  function applicaLingua() {
    L = TESTI[DATI.lingua] || TESTI.it;
    document.getElementById("tag").innerHTML = L.tag;
    document.getElementById("tag-footer").innerHTML = L.tag;
    document.documentElement.lang = DATI.lingua === "en" ? "en" : "it";
  }

  applicaLingua();

  bottone.addEventListener("click", prenota);

  function el(tag, attributi, figli) {
    const nodo = document.createElement(tag);
    Object.keys(attributi || {}).forEach(function (k) {
      if (k === "html") nodo.innerHTML = attributi[k];
      else if (k === "testo") nodo.textContent = attributi[k];
      else if (k === "onclick") nodo.addEventListener("click", attributi[k]);
      else nodo.setAttribute(k, attributi[k]);
    });
    (figli || []).forEach(function (f) { if (f) nodo.appendChild(f); });
    return nodo;
  }

  function escape(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c];
    });
  }

  function etichetta(slot) {
    return slot.g + ", " + slot.o;
  }

  function hero(titolo) {
    return [
      el("p", { "class": "saluto", testo: L.saluto.replace("{nome}", DATI.nome || "") }),
      el("h1", { html: titolo })
    ];
  }

  function avvisi() {
    const out = [];
    if (DATI.demo) out.push(el("div", { "class": "avviso", testo: L.demo }));
    if (stato.messaggio) {
      out.push(el("div", {
        "class": "avviso" + (stato.messaggio.errore ? " errore" : ""),
        role: "alert",
        testo: stato.messaggio.testo
      }));
    }
    return out;
  }

  function render() {

    app.innerHTML = "";

    if (DATI.stato === "caricamento") {
      app.appendChild(el("p", { "class": "intro", testo: "Caricamento… / Loading…" }));
      aggiornaBarra();
      return;
    }

    if (DATI.stato === "errore") {
      renderErrore();
      aggiornaBarra();
      return;
    }

    if (stato.chiuso) {
      hero(L.titoloChiuso).forEach(function (n) { app.appendChild(n); });
      if (stato.prenotazione) app.appendChild(boxPrenotazione());
      app.appendChild(el("p", { "class": "nota", testo: L.testoChiuso }));
      aggiornaBarra();
      return;
    }

    if (stato.prenotazione && !stato.modifica) {
      renderPrenotato();
    } else {
      renderScelta();
    }

    aggiornaBarra();

  }

  function renderErrore() {
    const problemaTecnico = DATI.codice === "server" || DATI.codice === "rete";
    const titolo = problemaTecnico
      ? "Qualcosa è andato storto<br><span style=\"color:#87938D\">Something went wrong</span>"
      : "Link non valido<br><span style=\"color:#87938D\">Invalid link</span>";

    app.appendChild(el("h1", { html: titolo }));

    const contatto = "<a href=\"mailto:" + escape(DATI.replyTo) + "\">" + escape(DATI.replyTo) + "</a>";

    app.appendChild(el("p", {
      "class": "intro",
      html: (problemaTecnico
        ? "Ricarica la pagina tra qualche minuto. Se il problema continua, scrivici a "
        : "Apri questa pagina dal pulsante nell'email che ti abbiamo mandato. Se non funziona, scrivici a ") +
        contatto + "."
    }));

    app.appendChild(el("p", {
      "class": "nota",
      html: (problemaTecnico
        ? "Please reload the page in a few minutes. If the problem persists, write to us at "
        : "Please open this page from the button in the email we sent you. If it doesn't work, write to us at ") +
        contatto + "."
    }));
  }

  function boxPrenotazione() {
    return el("div", { "class": "box" }, [
      el("p", { "class": "etichetta", testo: L.etichettaOk }),
      el("p", { "class": "giorno-ok", testo: stato.prenotazione.g }),
      el("p", { "class": "ora-ok", testo: stato.prenotazione.o })
    ]);
  }

  function renderPrenotato() {

    hero(L.titoloOk).forEach(function (n) { app.appendChild(n); });
    avvisi().forEach(function (n) { app.appendChild(n); });
    app.appendChild(boxPrenotazione());
    app.appendChild(el("p", { "class": "nota", testo: L.notaOk }));

    if (stato.prenotazione.modificabile) {
      app.appendChild(el("p", { "class": "nota" }, [
        el("button", {
          type: "button",
          "class": "link",
          testo: L.cambia,
          onclick: function () {
            stato.modifica = true;
            stato.messaggio = null;
            render();
          }
        })
      ]));
    } else {
      app.appendChild(el("p", { "class": "nota", testo: L.nonModificabile }));
    }

  }

  function renderScelta() {

    hero(L.titoloScegli).forEach(function (n) { app.appendChild(n); });

    if (stato.modifica && stato.prenotazione) {
      app.appendChild(el("p", {
        "class": "intro",
        html: L.introModifica.replace("{slot}", escape(etichetta(stato.prenotazione)))
      }));
      app.appendChild(el("p", { "class": "nota" }, [
        el("button", {
          type: "button",
          "class": "link",
          testo: L.tieni,
          onclick: function () {
            stato.modifica = false;
            stato.scelto = null;
            stato.messaggio = null;
            render();
          }
        })
      ]));
    } else {
      app.appendChild(el("p", { "class": "intro", html: L.introScegli }));
    }

    avvisi().forEach(function (n) { app.appendChild(n); });

    const slots = stato.slots.filter(function (s) {
      return !stato.prenotazione || s.k !== stato.prenotazione.k;
    });

    if (!slots.length) {
      app.appendChild(el("div", { "class": "avviso", testo: L.nessunoSlot }));
      return;
    }

    const giorni = [];
    const perGiorno = {};

    slots.forEach(function (s) {
      if (!perGiorno[s.d]) {
        perGiorno[s.d] = { etichetta: s.g, slots: [] };
        giorni.push(s.d);
      }
      perGiorno[s.d].slots.push(s);
    });

    giorni.forEach(function (d) {

      const g = perGiorno[d];
      const griglia = el("div", { "class": "orari", role: "group", "aria-label": g.etichetta });

      g.slots.forEach(function (s) {
        const selezionato = stato.scelto && stato.scelto.k === s.k;
        const b = el("button", {
          type: "button",
          "class": "orario",
          "aria-pressed": selezionato ? "true" : "false",
          "aria-label": etichetta(s),
          testo: s.o,
          onclick: function () {
            if (stato.inviando) return;
            stato.scelto = selezionato ? null : s;
            stato.messaggio = null;
            render();
          }
        });
        if (stato.inviando) b.disabled = true;
        griglia.appendChild(b);
      });

      app.appendChild(el("section", { "class": "giorno" }, [
        el("h2", { testo: g.etichetta }),
        griglia
      ]));

    });

    app.appendChild(el("p", { "class": "nota", testo: L.nessunoVa }));

  }

  function aggiornaBarra() {

    const visibile = !!stato.scelto && DATI.stato !== "errore" && !stato.chiuso &&
      (!stato.prenotazione || stato.modifica);

    barra.classList.toggle("visibile", visibile);
    barra.setAttribute("aria-hidden", visibile ? "false" : "true");

    if (!visibile) return;

    scelta.innerHTML = "";
    scelta.appendChild(document.createTextNode(L.haiScelto));
    scelta.appendChild(el("strong", { testo: etichetta(stato.scelto) }));

    bottone.textContent = stato.inviando ? L.inCorso : L.conferma;
    bottone.disabled = stato.inviando;

  }

  function prenota() {

    if (!stato.scelto || stato.inviando) return;

    stato.inviando = true;
    render();

    function errore() {
      stato.inviando = false;
      stato.messaggio = { testo: L.errori.generico, errore: true };
      render();
    }

    fetch(API_URL, {
      method: "POST",
      // text/plain: nessuna richiesta preliminare CORS
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ azione: "prenota", t: TOKEN, slot: stato.scelto.k }),
      credentials: "omit",
      redirect: "follow"
    })
      .then(function (risposta) { return risposta.json(); })
      .then(gestisciRisposta)
      .catch(errore);

  }

  function gestisciRisposta(r) {

    stato.inviando = false;

    if (r && r.slots) stato.slots = r.slots;

    if (r && r.ok) {
      stato.prenotazione = r.prenotazione;
      stato.scelto = null;
      stato.modifica = false;
      stato.messaggio = null;
      render();
      window.scrollTo(0, 0);
      return;
    }

    const codice = r && r.codice;

    if (codice === "chiuso") {
      stato.chiuso = true;
    } else if (codice === "link") {
      DATI.stato = "errore";
      DATI.codice = "link";
    }

    stato.scelto = null;
    stato.messaggio = { testo: L.errori[codice] || L.errori.generico, errore: true };
    render();
    window.scrollTo(0, 0);

  }

  function carica() {

    if (!TOKEN) {
      DATI = { stato: "errore", codice: "link", lingua: linguaBrowser(), replyTo: CONTATTO };
      applicaLingua();
      render();
      return;
    }

    fetch(API_URL + "?api=vista&t=" + encodeURIComponent(TOKEN), {
      credentials: "omit",
      redirect: "follow"
    })
      .then(function (risposta) { return risposta.json(); })
      .then(function (d) {
        DATI = d || { stato: "errore", codice: "server" };
        DATI.replyTo = DATI.replyTo || CONTATTO;
        stato.prenotazione = DATI.prenotazione || null;
        stato.slots = DATI.slots || [];
        stato.chiuso = DATI.stato === "chiuso";
        applicaLingua();
        render();
      })
      .catch(function () {
        DATI = { stato: "errore", codice: "rete", lingua: linguaBrowser(), replyTo: CONTATTO };
        applicaLingua();
        render();
      });

  }

  render();
  carica();
</script>

</body>
</html>
